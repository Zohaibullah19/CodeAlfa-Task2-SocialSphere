<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialSphere | Create Post</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #1877f2;
            --brand-primary-hover: #166fe5;
            --bg-main: #f0f2f5;
            --bg-card: #ffffff;
            --text-primary: #050505;
            --text-secondary: #65676b;
            --divider: #e4e6eb;
            --input-bg: #f0f2f5;
            --radius-main: 10px;
            --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .creator-container {
            background: var(--bg-card);
            width: 100%;
            max-width: 500px;
            border-radius: var(--radius-main);
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.02);
            overflow: hidden;
        }

        .creator-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--divider);
        }

        .creator-header h2 {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            flex: 1;
        }

        .close-btn {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 18px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--input-bg);
        }

        .creator-form {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .text-area {
            width: 100%;
            height: 120px;
            border: none;
            resize: none;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-primary);
        }

        .media-upload-box {
            border: 2px dashed var(--divider);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .media-upload-box:hover {
            background: var(--input-bg);
        }

        .media-upload-box i {
            font-size: 28px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .file-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .hidden-input {
            display: none;
        }

        .submit-btn {
            background: var(--brand-primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .submit-btn:hover {
            background: var(--brand-primary-hover);
        }
    </style>
</head>
<body>

    <div class="creator-container">
        <div class="creator-header">
            <h2>Create Post</h2>
            <a href="{% url 'feed' %}" class="close-btn"><i class="fa-solid fa-xmark"></i></a>
        </div>

        <form class="creator-form" action="{% url 'create_post' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <textarea name="content" class="text-area" placeholder="What's on your mind, {{ request.user.username }}?" required></textarea>
            
            <div class="media-upload-box">
                <i class="fa-regular fa-image" style="color: #45bd62;"></i>
                <label for="image-upload" class="file-label">Add Photo</label>
                <input type="file" id="image-upload" name="image" class="hidden-input" accept="image/*" onchange="updateLabel(this, 'Photo Added')">
            </div>

            <div class="media-upload-box">
                <i class="fa-regular fa-file-video" style="color: #f3425f;"></i>
                <label for="video-upload" class="file-label">Add Video</label>
                <input type="file" id="video-upload" name="video" class="hidden-input" accept="video/*" onchange="updateLabel(this, 'Video Added')">
            </div>

            <button type="submit" class="submit-btn">Post</button>
        </form>
    </div>

    <script>
        function updateLabel(input, successText) {
            if (input.files && input.files.length > 0) {
                const label = input.previousElementSibling;
                label.textContent = `${successText}: ${input.files[0].name}`;
                label.style.color = "#1877f2";
            }
        }
    </script>
</body>
</html>
